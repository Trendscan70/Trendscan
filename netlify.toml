# Configurazione Netlify per TrendScan (sito statico)
[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""
  # Controlla se il ramo corrente è esattamente "data" ed esce interrompendo il build
  ignore = "git rev-parse --abbrev-ref HEAD | grep -q '^data$'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Immagini social (Termometro, Trend Radar): rigenerate ogni ora dal workflow e salvate nel ramo "data".
# Cache breve, cosi' chi condivide vede dati freschi (le piattaforme social tengono comunque una copia per un po').
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=900"
    Content-Type = "image/png"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Pagina "Chi siamo": /chi-siamo (e /chi-siamo/) mostrano chi-siamo.html
[[redirects]]
  from = "/chi-siamo"
  to = "/chi-siamo.html"
  status = 200
  force = true

# Le immagini social stanno nel ramo "data" (non in main): la Function le legge con autenticazione server-side.
[[redirects]]
  from = "/og/*"
  to = "/.netlify/functions/private-data?file=og/:splat"
  status = 200
  force = true
